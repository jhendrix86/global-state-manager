version: '3.8'

services:
  global-state-manager:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: global-state-manager
    ports:
      - "8035:8035"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=11
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DATABASE=global_state
      - RABBITMQ_URL=amqp://rabbitmq:5672
      - OTEL_ENABLED=true
      - OTEL_ENDPOINT=http://jaeger:4318
    # No depends_on here - postgres/redis/rabbitmq/jaeger moved to shared
    # infra (deploy/docker-compose.infra.yml), a different compose
    # project. Bring that up first: deploy/03-build-and-up.sh infra-up
    networks:
      - os42-shared
    restart: unless-stopped

networks:
  os42-shared:
    external: true
